<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pac-Man</title>
<style>
  :root { --gold: #ffee00; --blue: #2121de; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: "Press Start 2P", "Courier New", monospace;
    touch-action: manipulation;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 12px 8px 28px;
  }
  .cabinet { width: min(100%, 520px); }
  .hud {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-align: center;
  }
  .hud .label { color: #fff; font-size: 11px; }
  .hud .num { color: var(--gold); margin-top: 4px; min-height: 16px; }
  .hud .oneup { color: #fff; }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
    image-rendering: pixelated;
    touch-action: none;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    min-height: 28px;
  }
  .lives { display: flex; gap: 6px; }
  .life, .fruit {
    width: 18px;
    height: 18px;
  }
  .hint {
    color: #9ca3af;
    font-family: "Trebuchet MS", sans-serif;
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
  }
  .pad {
    display: grid;
    grid-template-columns: 76px 76px 76px;
    gap: 8px;
    justify-content: center;
    margin-top: 14px;
    touch-action: none;
    user-select: none;
  }
  .pad button {
    background: #111;
    color: var(--gold);
    border: 2px solid #2121de;
    border-radius: 10px;
    font-size: 22px;
    padding: 14px 0;
    touch-action: none;
  }
  .pad .blank { visibility: hidden; }
</style>
</head>
<body>
  <div class="cabinet">
    <div class="hud">
      <div><div class="label oneup" id="oneup">1UP</div><div class="num" id="score">00</div></div>
      <div><div class="label">HIGH SCORE</div><div class="num" id="high">00</div></div>
      <div><div class="label">2UP</div><div class="num">00</div></div>
    </div>
    <canvas id="game" width="448" height="496"></canvas>
    <div class="footer">
      <div class="lives" id="lives"></div>
      <canvas class="fruit" id="fruit" width="18" height="18"></canvas>
    </div>
    <div class="hint">Computer: arrow keys or WASD. Phone: swipe the maze or use the buttons.</div>
    <div class="pad">
      <span class="blank"></span>
      <button type="button" data-dir="up">▲</button>
      <span class="blank"></span>
      <button type="button" data-dir="left">◀</button>
      <button type="button" data-dir="down">▼</button>
      <button type="button" data-dir="right">▶</button>
    </div>
  </div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const TILE = 16;
const MAP = [
  "############################",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#o####.#####.##.#####.####o#",
  "#.####.#####.##.#####.####.#",
  "#..........................#",
  "#.####.##.########.##.####.#",
  "#.####.##.########.##.####.#",
  "#......##....##....##......#",
  "######.##### ## #####.######",
  "     #.##### ## #####.#     ",
  "     #.##          ##.#     ",
  "     #.## ###--### ##.#     ",
  "######.## #      # ##.######",
  "      .   #      #   .      ",
  "######.## #      # ##.######",
  "     #.## ######## ##.#     ",
  "     #.##          ##.#     ",
  "     #.## ######## ##.#     ",
  "######.## ######## ##.######",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#.####.#####.##.#####.####.#",
  "#o..##................##..o#",
  "###.##.##.########.##.##.###",
  "###.##.##.########.##.##.###",
  "#......##....##....##......#",
  "#.##########.##.##########.#",
  "#.##########.##.##########.#",
  "#..........................#",
  "############################",
];
const ROWS = MAP.length;
const COLS = MAP[0].length;
canvas.width = COLS * TILE;
canvas.height = ROWS * TILE;

const DIRS = {
  left:  { x: -1, y: 0 },
  right: { x: 1, y: 0 },
  up:    { x: 0, y: -1 },
  down:  { x: 0, y: 1 },
};
const OPP = { left: "right", right: "left", up: "down", down: "up" };
const ORDER = ["up", "left", "down", "right"];
const GHOSTS = [
  { name: "blinky", color: "#ff0000", scatter: { x: 25, y: 0 }, tx: 13, ty: 11, dir: "left", wait: 0 },
  { name: "pinky",  color: "#ffb8ff", scatter: { x: 2, y: 0 },  tx: 13, ty: 14, dir: "down", wait: 60 },
  { name: "inky",   color: "#00ffff", scatter: { x: 27, y: 30 }, tx: 11, ty: 14, dir: "up", wait: 240 },
  { name: "clyde",  color: "#ffb852", scatter: { x: 0, y: 30 }, tx: 15, ty: 14, dir: "up", wait: 480 },
];

let grid, pellets, score, high, lives, level, extraAwarded;
let pac, ghosts, phase, mode, modeTimer, frightTimer, frightCombo;
let mouth, flash, dying, deadFrame, ready, message, fruit, fruitTimer, popups;
let audioOn = false, audioCtx, waka = 0;

const scoreEl = document.getElementById("score");
const highEl = document.getElementById("high");
const livesEl = document.getElementById("lives");
const oneupEl = document.getElementById("oneup");
high = Number(localStorage.getItem("pac-high") || 0);

function cell(x, y) {
  if (y < 0 || y >= ROWS) return "#";
  if (x < 0 || x >= COLS) return " ";
  return grid[y][x];
}
function blocked(x, y, ghost) {
  const c = cell(x, y);
  if (c === "#") return true;
  if (c === "-" && !ghost) return true;
  return false;
}
function inTunnel(y) { return y === 14; }

function cloneMap() {
  return MAP.map((row) => row.split(""));
}

function makePac() {
  return { tx: 13, ty: 23, ox: 0, oy: 0, dir: "left", next: "left", speed: 1.05, stopped: false };
}
function makeGhost(spec) {
  return {
    ...spec,
    ox: 0, oy: 0,
    state: spec.name === "blinky" ? "out" : "house",
    home: { x: spec.tx, y: spec.ty },
    release: spec.wait,
  };
}

function freshLevel() {
  grid = cloneMap();
  pellets = 0;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y][x] === "." || grid[y][x] === "o") pellets++;
    }
  }
  pac = makePac();
  ghosts = GHOSTS.map(makeGhost);
  mode = "scatter";
  modeTimer = 7 * 60;
  frightTimer = 0;
  frightCombo = 0;
  mouth = 0;
  dying = false;
  deadFrame = 0;
  ready = 120;
  message = "READY!";
  fruit = null;
  fruitTimer = 0;
  popups = [];
  phase = "play";
}

function newGame() {
  score = 0;
  lives = 3;
  level = 1;
  extraAwarded = false;
  freshLevel();
  syncHud();
}

function syncHud() {
  scoreEl.textContent = String(score).padStart(2, "0");
  if (score > high) {
    high = score;
    localStorage.setItem("pac-high", String(high));
  }
  highEl.textContent = String(high).padStart(2, "0");
  livesEl.innerHTML = "";
  for (let i = 0; i < lives; i++) {
    const c = document.createElement("canvas");
    c.width = 18; c.height = 18; c.className = "life";
    const g = c.getContext("2d");
    g.fillStyle = "#ffee00";
    g.beginPath();
    g.moveTo(9, 9);
    g.arc(9, 9, 7, 0.35, Math.PI * 2 - 0.35);
    g.fill();
    livesEl.appendChild(c);
  }
  const fc = document.getElementById("fruit");
  const g = fc.getContext("2d");
  g.clearRect(0, 0, 18, 18);
  if (level >= 1) {
    g.fillStyle = "#ff2a2a";
    g.beginPath();
    g.arc(9, 10, 6, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = "#3d8c40";
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(9, 5);
    g.lineTo(12, 1);
    g.stroke();
  }
}

function posOf(a) {
  return { x: a.tx * TILE + TILE / 2 + a.ox, y: a.ty * TILE + TILE / 2 + a.oy };
}

function canStep(a, dir, ghost) {
  const d = DIRS[dir];
  const nx = a.tx + d.x;
  const ny = a.ty + d.y;
  if (inTunnel(a.ty) && (nx < 0 || nx >= COLS)) return true;
  return !blocked(nx, ny, ghost);
}

function reverseNow(a) {
  a.dir = OPP[a.dir] || a.dir;
  a.next = a.dir;
  a.ox = -a.ox;
  a.oy = -a.oy;
}

function setWant(dir) {
  if (!DIRS[dir] || phase !== "play" || dying) return;
  ensureAudio();
  if (pac.dir === OPP[dir] && (pac.ox || pac.oy)) reverseNow(pac);
  pac.next = dir;
}

function stepActor(a, speed, ghost) {
  if (a.stopped) return;
  const d = DIRS[a.dir];
  a.ox += d.x * speed;
  a.oy += d.y * speed;
  const crossed = Math.abs(a.ox) >= TILE || Math.abs(a.oy) >= TILE;
  if (!crossed) return false;
  a.tx += d.x;
  a.ty += d.y;
  a.ox = 0;
  a.oy = 0;
  if (a.tx < 0) a.tx = COLS - 1;
  if (a.tx >= COLS) a.tx = 0;
  return true;
}

function chooseGhostDir(g) {
  const target = ghostTarget(g);
  let options = ORDER.filter((dir) => dir !== OPP[g.dir] && canStep(g, dir, true));
  if (!options.length) options = ORDER.filter((dir) => canStep(g, dir, true));
  if (!options.length) return;
  if (g.state === "frightened") {
    g.dir = options[Math.floor(Math.random() * options.length)];
    return;
  }
  options.sort((a, b) => {
    const da = DIRS[a], db = DIRS[b];
    const ax = g.tx + da.x, ay = g.ty + da.y;
    const bx = g.tx + db.x, by = g.ty + db.y;
    return Math.hypot(ax - target.x, ay - target.y) - Math.hypot(bx - target.x, by - target.y);
  });
  g.dir = options[0];
}

function ghostTarget(g) {
  if (g.state === "eaten") return { x: 13, y: 11 };
  if (g.state === "house" || g.state === "exit") return { x: 13, y: 11 };
  if (g.state === "frightened") return { x: g.tx, y: g.ty };
  if (mode === "scatter") return g.scatter;
  if (g.name === "blinky") return { x: pac.tx, y: pac.ty };
  if (g.name === "pinky") {
    const d = DIRS[pac.dir];
    return { x: pac.tx + d.x * 4, y: pac.ty + d.y * 4 };
  }
  if (g.name === "inky") {
    const d = DIRS[pac.dir];
    const px = pac.tx + d.x * 2;
    const py = pac.ty + d.y * 2;
    const b = ghosts[0];
    return { x: px + (px - b.tx), y: py + (py - b.ty) };
  }
  const dist = Math.hypot(g.tx - pac.tx, g.ty - pac.ty);
  return dist < 8 ? g.scatter : { x: pac.tx, y: pac.ty };
}

function eatTile() {
  const c = grid[pac.ty][pac.tx];
  if (c === ".") {
    grid[pac.ty][pac.tx] = " ";
    addScore(10);
    pellets--;
    wakaTone();
  } else if (c === "o") {
    grid[pac.ty][pac.tx] = " ";
    addScore(50);
    pellets--;
    frightTimer = 60 * (level < 3 ? 6 : 4);
    frightCombo = 0;
    ghosts.forEach((g) => {
      if (g.state === "out") {
        g.state = "frightened";
        reverseNow(g);
      }
    });
  }
  if (fruit && pac.tx === fruit.x && pac.ty === fruit.y) {
    addScore(100);
    popup(fruit.x, fruit.y, "100");
    fruit = null;
  }
  if (!fruit && pellets === 180) {
    fruit = { x: 13, y: 17 };
    fruitTimer = 60 * 9;
  }
  if (pellets <= 0) {
    phase = "cleared";
    message = "";
    ready = 90;
  }
}

function addScore(n) {
  score += n;
  if (!extraAwarded && score >= 10000) {
    extraAwarded = true;
    lives++;
  }
  syncHud();
}
function popup(tx, ty, text) {
  popups.push({ x: tx * TILE + TILE / 2, y: ty * TILE, text, life: 50 });
}

function hitTest() {
  const p = posOf(pac);
  for (const g of ghosts) {
    const gp = posOf(g);
    if (Math.hypot(gp.x - p.x, gp.y - p.y) > TILE * 0.7) continue;
    if (g.state === "frightened") {
      g.state = "eaten";
      frightCombo++;
      const pts = 200 * (2 ** (frightCombo - 1));
      addScore(pts);
      popup(g.tx, g.ty, String(pts));
    } else if (g.state === "out") {
      dying = true;
      deadFrame = 0;
      message = "";
      return;
    }
  }
}

function updateGhost(g) {
  if (g.state === "house") {
    g.release--;
    if (g.release <= 0) g.state = "exit";
    if (stepActor(g, 0.5, true)) {
      if (!canStep(g, g.dir, true)) g.dir = OPP[g.dir];
    }
    return;
  }
  if (g.state === "exit") {
    if (g.tx !== 13) g.dir = g.tx < 13 ? "right" : "left";
    else g.dir = "up";
    if (stepActor(g, 0.75, true) && g.ty === 11 && g.tx === 13) {
      g.state = frightTimer > 0 ? "frightened" : "out";
      g.dir = "left";
    }
    return;
  }
  const speed = g.state === "eaten" ? 1.8 : g.state === "frightened" ? 0.65 : 0.9 + Math.min(level, 6) * 0.03;
  if (stepActor(g, speed, true)) {
    if (g.state === "eaten" && g.tx === 13 && g.ty === 11) {
      g.state = "house";
      g.tx = 13; g.ty = 14; g.dir = "down"; g.release = 30;
      return;
    }
    const choices = ORDER.filter((dir) => dir !== OPP[g.dir] && canStep(g, dir, true));
    if (choices.length > 1 || !canStep(g, g.dir, true) || g.state === "frightened") chooseGhostDir(g);
  }
}

function update() {
  oneupEl.style.visibility = Math.floor(performance.now() / 400) % 2 ? "visible" : "hidden";
  popups.forEach((p) => p.life--);
  popups = popups.filter((p) => p.life > 0);
  if (fruit) {
    fruitTimer--;
    if (fruitTimer <= 0) fruit = null;
  }
  if (phase === "cleared") {
    ready--;
    if (ready <= 0) {
      level++;
      freshLevel();
    }
    return;
  }
  if (phase !== "play") return;
  if (ready > 0) {
    ready--;
    if (ready === 0) message = "";
    return;
  }
  if (dying) {
    deadFrame++;
    if (deadFrame > 70) {
      lives--;
      syncHud();
      if (lives <= 0) {
        phase = "over";
        message = "GAME OVER";
      } else {
        pac = makePac();
        ghosts = GHOSTS.map(makeGhost);
        ready = 90;
        message = "READY!";
        dying = false;
        mode = "scatter";
        modeTimer = 7 * 60;
        frightTimer = 0;
      }
    }
    return;
  }

  if (frightTimer > 0) {
    frightTimer--;
    if (frightTimer === 0) {
      ghosts.forEach((g) => { if (g.state === "frightened") g.state = "out"; });
    }
  } else {
    modeTimer--;
    if (modeTimer <= 0) {
      mode = mode === "scatter" ? "chase" : "scatter";
      modeTimer = mode === "scatter" ? 5 * 60 : 20 * 60;
      ghosts.forEach((g) => { if (g.state === "out") reverseNow(g); });
    }
  }

  if (canStep(pac, pac.next, false)) pac.dir = pac.next;
  pac.stopped = !canStep(pac, pac.dir, false) && pac.ox === 0 && pac.oy === 0;
  const arrived = stepActor(pac, pac.speed + Math.min(level, 8) * 0.02, false);
  if (arrived) {
    if (canStep(pac, pac.next, false)) pac.dir = pac.next;
    pac.stopped = !canStep(pac, pac.dir, false);
    eatTile();
  }
  mouth += pac.stopped ? 0 : 0.22;
  ghosts.forEach(updateGhost);
  hitTest();
}

function drawMaze() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "#2121de";
  ctx.lineWidth = 3;
  ctx.lineJoin = "round";
  ctx.beginPath();
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (cell(x, y) === "#") continue;
      const x0 = x * TILE, y0 = y * TILE, x1 = x0 + TILE, y1 = y0 + TILE;
      if (cell(x, y - 1) === "#") { ctx.moveTo(x0, y0 + 2); ctx.lineTo(x1, y0 + 2); }
      if (cell(x, y + 1) === "#") { ctx.moveTo(x0, y1 - 2); ctx.lineTo(x1, y1 - 2); }
      if (cell(x - 1, y) === "#") { ctx.moveTo(x0 + 2, y0); ctx.lineTo(x0 + 2, y1); }
      if (cell(x + 1, y) === "#") { ctx.moveTo(x1 - 2, y0); ctx.lineTo(x1 - 2, y1); }
    }
  }
  ctx.stroke();
  ctx.strokeStyle = "#ffb8ff";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(13 * TILE, 12 * TILE + TILE / 2);
  ctx.lineTo(15 * TILE, 12 * TILE + TILE / 2);
  ctx.stroke();
}

function drawPellets() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const c = grid[y][x];
      const cx = x * TILE + TILE / 2;
      const cy = y * TILE + TILE / 2;
      if (c === ".") {
        ctx.fillStyle = "#ffb897";
        ctx.fillRect(cx - 1.5, cy - 1.5, 3, 3);
      } else if (c === "o") {
        if (Math.floor(performance.now() / 160) % 2) {
          ctx.fillStyle = "#ffb897";
          ctx.beginPath();
          ctx.arc(cx, cy, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }
  if (fruit) {
    ctx.fillStyle = "#ff2a2a";
    ctx.beginPath();
    ctx.arc(fruit.x * TILE + TILE / 2, fruit.y * TILE + TILE / 2, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#3d8c40";
    ctx.beginPath();
    ctx.moveTo(fruit.x * TILE + TILE / 2, fruit.y * TILE + 3);
    ctx.lineTo(fruit.x * TILE + TILE / 2 + 4, fruit.y * TILE);
    ctx.stroke();
  }
}

function drawPac() {
  const p = posOf(pac);
  ctx.fillStyle = "#ffee00";
  ctx.beginPath();
  if (dying) {
    const t = Math.min(1, deadFrame / 55);
    ctx.moveTo(p.x, p.y);
    ctx.arc(p.x, p.y, 7, Math.PI * t, Math.PI * 2 - Math.PI * t * 0.2);
  } else {
    const open = pac.stopped ? 0.2 : 0.15 + Math.abs(Math.sin(mouth)) * 0.45;
    const facing = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[pac.dir];
    ctx.moveTo(p.x, p.y);
    ctx.arc(p.x, p.y, 7, facing + open, facing + Math.PI * 2 - open);
  }
  ctx.closePath();
  ctx.fill();
}

function drawGhost(g) {
  const p = posOf(g);
  const flashOn = frightTimer > 0 && frightTimer < 120 && Math.floor(frightTimer / 10) % 2 === 0;
  let color = g.color;
  if (g.state === "frightened") color = flashOn ? "#fff" : "#2121ff";
  if (g.state === "eaten") color = "rgba(0,0,0,0)";
  const r = 7;
  if (g.state !== "eaten") {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x, p.y - 1, r, Math.PI, 0);
    ctx.lineTo(p.x + r, p.y + 6);
    const wobble = Math.floor(performance.now() / 120) % 2 ? 1 : -1;
    ctx.lineTo(p.x + 4, p.y + 4 + wobble);
    ctx.lineTo(p.x + 1, p.y + 6);
    ctx.lineTo(p.x - 2, p.y + 4 - wobble);
    ctx.lineTo(p.x - 5, p.y + 6);
    ctx.lineTo(p.x - r, p.y + 6);
    ctx.closePath();
    ctx.fill();
  }
  const ox = DIRS[g.dir].x * 1.5;
  const oy = DIRS[g.dir].y * 1.5;
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(p.x - 3 + ox, p.y - 2 + oy, 2.4, 0, Math.PI * 2);
  ctx.arc(p.x + 3 + ox, p.y - 2 + oy, 2.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = g.state === "frightened" ? (flashOn ? "#ff0000" : "#fff") : "#00f";
  if (g.state === "frightened") {
    ctx.fillRect(p.x - 5, p.y + 2, 2, 2);
    ctx.fillRect(p.x - 1, p.y + 4, 2, 2);
    ctx.fillRect(p.x + 3, p.y + 2, 2, 2);
  } else {
    ctx.beginPath();
    ctx.arc(p.x - 2.2 + ox * 1.4, p.y - 2 + oy * 1.4, 1.2, 0, Math.PI * 2);
    ctx.arc(p.x + 3.8 + ox * 1.4, p.y - 2 + oy * 1.4, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawCenterText(text, color) {
  ctx.fillStyle = color;
  ctx.font = "bold 14px Courier New, monospace";
  ctx.textAlign = "center";
  ctx.fillText(text, canvas.width / 2, 17 * TILE + 12);
}

function draw() {
  drawMaze();
  drawPellets();
  if (!dying) ghosts.forEach(drawGhost);
  if (phase !== "over") drawPac();
  popups.forEach((p) => {
    ctx.fillStyle = "#00ffff";
    ctx.font = "bold 10px Courier New, monospace";
    ctx.textAlign = "center";
    ctx.fillText(p.text, p.x, p.y);
  });
  if (message) drawCenterText(message, message === "GAME OVER" ? "#ff0000" : "#ffee00");
  if (phase === "cleared") drawCenterText("LEVEL CLEAR", "#ffee00");
}

function frame() {
  update();
  draw();
  requestAnimationFrame(frame);
}

function ensureAudio() {
  if (audioOn) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  audioOn = true;
}
function wakaTone() {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "square";
  o.frequency.value = waka++ % 2 ? 440 : 330;
  g.gain.value = 0.03;
  o.connect(g); g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + 0.05);
}

window.addEventListener("keydown", (e) => {
  const map = {
    ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
    a: "left", d: "right", w: "up", s: "down",
    A: "left", D: "right", W: "up", S: "down",
  };
  if (map[e.key]) {
    e.preventDefault();
    if (phase === "over") newGame();
    setWant(map[e.key]);
  } else if (e.key === "Enter" && phase === "over") {
    newGame();
  }
});
document.querySelectorAll("[data-dir]").forEach((btn) => {
  const press = (e) => {
    e.preventDefault();
    if (phase === "over") newGame();
    setWant(btn.dataset.dir);
  };
  btn.addEventListener("pointerdown", press);
});

let swipeX = 0;
let swipeY = 0;
canvas.addEventListener("touchstart", (e) => {
  const t = e.changedTouches[0];
  swipeX = t.clientX;
  swipeY = t.clientY;
}, { passive: true });
canvas.addEventListener("touchend", (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - swipeX;
  const dy = t.clientY - swipeY;
  if (Math.hypot(dx, dy) < 18) return;
  if (phase === "over") newGame();
  if (Math.abs(dx) > Math.abs(dy)) setWant(dx > 0 ? "right" : "left");
  else setWant(dy > 0 ? "down" : "up");
}, { passive: true });

newGame();
requestAnimationFrame(frame);
</script>
</body>
</html>
